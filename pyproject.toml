[project]
name = "crac-client"
version = "0.1.0"
description = "Client for connecting to crac server via gRPC"
authors = [{ name = "Alessio Caradossi", email = "alessio@theeyes.org" }]
license = "GPL-3.0-only"
requires-python = ">=3.10"
dependencies = [
    "crac-protobuf @ git+https://github.com/ara-astronomia/crac-protobuf@14-implement-contract-for-ups",
    "grpcio-tools>=1.43.0",
    "Flask>=2.0.3",
    "opencv-python>=4.5.5",
    "python-dotenv>=0.20.0",
    "plotly>=5.7.0",
    "kaleido==0.2.1",
    "FreeSimpleGUI>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "autopep8>=1.6.0",
]

[tool.setuptools.packages.find]
include = ["crac_client*"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]
